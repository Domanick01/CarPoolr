{% extends 'base.html' %}

{% block title %}CarPoolr - Login{% endblock %}

{% block content %}
<main class="page-shell page-shell-narrow">
    <div class="card app-card p-4 p-md-5 mx-auto" style="max-width: 440px;">
        <h1 class="h2 fw-bold mb-2">Welcome back</h1>
        <p class="text-muted mb-4">Sign in to keep your rides moving.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="d-grid gap-3">
            {% csrf_token %}

            <div>
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" id="username" name="username" class="form-control form-control-lg" required>
            </div>

            <div>
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg" required>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100">Login</button>
        </form>
    </div>
</main>
{% endblock %}
