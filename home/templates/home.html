<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPoolr - Share the Ride, Share the Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Navigation Bar */
        nav {
            background-color: #000;
            padding: 16px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-signin {
            background: transparent;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .btn-signin:hover {
            background-color: #1a1a1a;
        }

        .btn-signup {
            background-color: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .btn-signup:hover {
            background-color: #b91c1c;
        }

        /* Hero Section */
        .hero {
            padding: 80px 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-content {
            max-width: 800px;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #000;
        }

        .hero-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 48px;
            line-height: 1.5;
        }

        /* Search Card */
        .search-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .location-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            border: none;
            background-color: #f5f5f5;
            border-radius: 8px;
            outline: none;
            transition: background-color 0.2s;
        }

        .location-input:focus {
            background-color: #e5e5e5;
        }

        .location-input::placeholder {
            color: #999;
        }

        .location-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #dc2626;
            font-size: 20px;
            font-weight: 600;
        }

        .btn-search {
            width: 100%;
            background-color: #dc2626;
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 24px;
            transition: background-color 0.3s;
        }

        .btn-search:hover {
            background-color: #b91c1c;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                padding: 16px 24px;
            }

            .hero {
                padding: 48px 24px;
            }

            h1 {
                font-size: 40px;
            }

            .search-card {
                padding: 24px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <a href="#" class="logo">CarPoolr</a>
        <div class="nav-buttons">
            <button class="btn-signin">Sign In</button>
            <button class="btn-signup">Sign Up</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Go anywhere with<br>CarPoolr</h1>
            <p class="hero-subtitle">Connect with fellow travelers and make every trip more affordable</p>

            <!-- Search Card -->
            <div class="search-card">
                <form>
                    <div class="input-group">
                        <span class="location-icon">📍</span>
                        <input
                            type="text"
                            class="location-input"
                            placeholder="Pickup location"
                            name="pickup"
                        >
                    </div>

                    <div class="input-group">
                        <span class="location-icon">📍</span>
                        <input
                            type="text"
                            class="location-input"
                            placeholder="Dropoff location"
                            name="dropoff"
                        >
                    </div>

                    <button type="submit" class="btn-search">Search rides</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
