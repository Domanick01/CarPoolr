<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Ride - CarPoolr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    /* Navigation Bar (match home) */
    nav {
      background-color: #000;
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-buttons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-signin {
      background: transparent;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-signin:hover {
      background-color: #1a1a1a;
    }

    .btn-signup {
      background-color: #dc2626;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-signup:hover {
      background-color: #b91c1c;
    }

    /* Page layout */
    .page {
      padding: 48px;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }

    .form-card {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #000;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Django default form.as_p styling */
    form p {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: none;
      background-color: #f5f5f5;
      border-radius: 8px;
      outline: none;
      transition: background-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      background-color: #e5e5e5;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background-color: #dc2626;
      color: #fff;
      border: none;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #b91c1c;
    }

    .link {
      color: #000;
      text-decoration: none;
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    .errors {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-left: 6px solid #dc2626;
      color: #333;
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .logo { font-size: 24px; }
      .page { padding: 24px; }
      .form-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="logo">CarPoolr</a>
    <div class="nav-buttons">
      <a class="btn-signin" href="{% url 'rides:list' %}">Rides</a>
      {% if user.is_authenticated %}
        <a class="btn-signin" href="{% url 'account:logout' %}">Logout</a>
      {% else %}
        <a class="btn-signin" href="{% url 'account:login' %}">Sign In</a>
        <a class="btn-signup" href="{% url 'account:register' %}">Sign Up</a>
      {% endif %}
    </div>
  </nav>

  <main class="page">
    <div class="form-card">
      <h1>Post a ride</h1>
      <p class="subtitle">Add your pickup, destination, price, and departure time.</p>

      {% if form.non_field_errors %}
        <div class="errors">{{ form.non_field_errors }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="actions">
          <button class="btn-primary" type="submit">Publish ride</button>
          <a class="link" href="{% url 'rides:list' %}">Back to rides</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
